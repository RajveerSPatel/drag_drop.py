<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Day View - Lesson Planner</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="page">

  <!-- Navigation back to the main parts of the application -->
  <nav class="main-nav">
    <a href="calendar.html" class="nav-link">Calendar</a>
    <a href="lesson-library.html" class="nav-link">Lesson Library</a>
    <a href="lesson-creator.html" class="nav-link">Create Lesson</a>
  </nav>

  <a href="calendar.html" class="back-link">
    ← Back to Calendar
  </a>

  <div class="day-header">

    <div>
      <h1 id="date-title">Day Schedule</h1>
    </div>

    <div id="day-status" class="day-status">
      School day
    </div>

  </div>

  <section>

    <h2>Daily Schedule</h2>

    <p>
      Drag lessons up or down to change the order they appear during the day.
    </p>

    <div id="schedule-board" class="schedule-board"></div>

  </section>

  <section class="add-lesson-box">

    <h2>Add a Lesson</h2>

    <p>
      Select a lesson from your lesson library to add it to this day's schedule.
    </p>

    <div id="lesson-options"></div>

  </section>

</div>

<script src="day-view.js"></script>

</body>
</html>
